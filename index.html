:root {

}

.progress-bar-container {
  max-width: 800px;
  margin: 0 auto 20px auto;
  background: #e2e8f0;
  border-radius: 8px;
  height: 10px;
  overflow: hidden;
}

.progress-bar {
  background: var(--color-primary);
  height: 100%;
  width: 0%;

}

.progress-text {
  text-align: center;
  font-size: 15px;
  font-weight: 500;

.question {

  line-height: 1.6;
  margin-bottom: 20px;
}

.options-container {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.option {
  display: flex;
  align-items: center;
  background: #f1f5f9;
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 14px 20px;
  font-size: 19px;

  cursor: pointer;
  transition: all 0.2s;

  min-height: 52px;
  box-sizing: border-box;
}

.option:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}

.option.pending {

  color: var(--color-pending-text);
  border-color: var(--color-selecting);
  transform: scale(1.02);
}

.option.correct {
  background-color: var(--color-correct);
  color: #fff;
  border-color: var(--color-correct);
}

.option.wrong {
  background-color: var(--color-wrong);
  color: #fff;
  border-color: var(--color-wrong);
  animation: shake 0.1s ease-in-out 2;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.option-label {
  font-weight: 700;
  margin-right: 12px;
  min-width: 24px;
}

.check-btn, .submit-btn {
  width: 100%;
  max-width: 400px;
  margin: 30px auto;
  display: block;
  padding: 15px 40px;
  font-size: 20px;
  font-weight: 700;
  background: var(--color-correct);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(34,197,94,0.3);
  font-family: inherit;

.check-btn:disabled, 

.explanation {

  margin-top: 20px;
  padding: 16px;

  border-radius: 8px;
  font-size: 18px;
  font-weight: 400;
  line-height: 1.8;
  color: #0369a1;

.summary-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 30px;
  background: var(--color-card);
  max-width: 800px;
  margin-left: auto;

  padding: 8px;
  text-align: center;
  font-size: 14px;

.summary-table .correct-cell { background-color: var(--color-correct); color: #fff; }
.summary-table .wrong-cell { background-color: var(--color-wrong); color: #fff; }
.summary-table .neutral-cell { background-color: #F1F5F9; color: #64748b; }

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq1, dur1, freq2 = null, dur2 = null, type = 'sine', volume = 0.1) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.type = type;
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(volume, audioCtx.currentTime);
    
    if (freq2 && dur2) {
      osc.frequency.setValueAtTime(freq2, audioCtx.currentTime + dur1);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur1 + dur2);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + dur1 + dur2);
    } else {
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur1);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + dur1);
    }
  } catch (e) {}
}

function playSelectSound() { playTone(600, 0.08, null, null, 'sine', 0.15); }
function playCorrectSound() { playTone(800, 0.1, 1200, 0.15, 'sine', 0.2); }
function playWrongSound() { playTone(150, 0.2, null, null, 'square', 0.12); }

let userState = {};
quizData.forEach(q => {
  userState[q.id] = { selected: null, checked: false, isCorrect: null };
});

function shuffleArray(arr) {
  let array = [...arr];
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    
  }
  return array;
}

const quizContainer = document.getElementById("quiz-container");
const labels = ["A", "B", "C", "D"];

quizData.forEach(q => {
  const card = document.createElement("div");
  card.className = "card";
  card.id = `card-${q.id}`;
  
  let qHtml = `<div class="question">${q.questionHTML}</div>`;
  qHtml += `<div class="options-container" id="options-${q.id}">`;
  
  let shuffledOptions = shuffleArray(q.options);
  let shuffledLabels = shuffleArray(labels);
  
  let displayOptions = shuffledOptions.map((opt, idx) => {
    return {
      displayLabel: shuffledLabels[idx],
      originalLabel: opt.label,
      html: opt.html,
      isCorrect: opt.isCorrect
    };
  });
  
  displayOptions.sort((a,b) => a.displayLabel.localeCompare(b.displayLabel));
  
  displayOptions.forEach(opt => {
    qHtml += `<div class="option" data-original-label="${opt.originalLabel}" onclick="selectOption(${q.id}, '${opt.originalLabel}', this)">
      <span class="option-label">${opt.displayLabel}.</span> ${opt.html}
    </div>`;
  });
  
  qHtml += `</div>
    <button class="check-btn" id="check-btn-${q.id}" onclick="checkAnswer(${q.id})" disabled>Kiểm tra</button>
    <div class="explanation" id="expl-${q.id}">${q.explanationHTML}</div>
  `;
  
  card.innerHTML = qHtml;
  quizContainer.appendChild(card);
});

function updateProgress() {
  let selectedCount = Object.values(userState).filter(s => s.selected !== null).length;
  document.getElementById("progress-count").textContent = selectedCount;
  document.getElementById("progress-bar").style.width = (selectedCount / quizData.length * 100) + "%";
}

function selectOption(qId, originalLabel, elem) {
  if (userState[qId].checked) return;
  
  userState[qId].selected = originalLabel;
  
  const optionsDiv = document.getElementById(`options-${qId}`);
  Array.from(optionsDiv.children).forEach(child => child.classList.remove('pending'));
  elem.classList.add('pending');
  
  document.getElementById(`check-btn-${qId}`).disabled = false;
  playSelectSound();
  updateProgress();
}

function checkAnswer(qId, auto = false) {
  const state = userState[qId];
  if (state.checked || state.selected === null) return;
  
  const qItem = quizData.find(q => q.id === qId);
  const correctOpt = qItem.options.find(o => o.isCorrect);
  
  state.isCorrect = (state.selected === correctOpt.label);
  state.checked = true;
  
  const optionsDiv = document.getElementById(`options-${qId}`);
  Array.from(optionsDiv.children).forEach(child => {
    child.classList.remove('pending');
    child.style.pointerEvents = "none";
    const optLabel = child.getAttribute('data-original-label');
    if (optLabel === correctOpt.label) {
      child.classList.add('correct');
    } else if (optLabel === state.selected && !state.isCorrect) {
      child.classList.add('wrong');
    }
  });
  
  document.getElementById(`check-btn-${qId}`).style.display = "none";
  document.getElementById(`expl-${qId}`).style.display = "block";
  
  if (!auto) {
    if (state.isCorrect) playCorrectSound();
    else playWrongSound();
  }
}

document.getElementById("submit-btn").addEventListener("click", function() {
  const studentName = document.getElementById("studentName").value.trim();
  if (!studentName) {
    alert("Vui lòng nhập tên học sinh trước khi nộp bài!");
    return;
  }
  
  let totalCorrect = 0;
  let wrongDetails = [];
  
  quizData.forEach(q => {
    const state = userState[q.id];
    if (!state.checked) {
      if (state.selected !== null) {
        checkAnswer(q.id, true);
      } else {
        state.checked = true;
        state.isCorrect = false;
        
        const qItem = quizData.find(x => x.id === q.id);
        const correctOpt = qItem.options.find(o => o.isCorrect);
        
        const optionsDiv = document.getElementById(`options-${q.id}`);
        Array.from(optionsDiv.children).forEach(child => {
          child.style.pointerEvents = "none";
          if (child.getAttribute('data-original-label') === correctOpt.label) {
            child.classList.add('correct');
          }
        });
        document.getElementById(`check-btn-${q.id}`).style.display = "none";
        document.getElementById(`expl-${q.id}`).style.display = "block";
      }
    }
    
    if (state.isCorrect) {
      totalCorrect++;
    } else {
      wrongDetails.push(`Câu ${q.id}: Chọn ${state.selected || 'Bỏ trống'}`);
    }
  });
  
  let scoreRatio = `${totalCorrect}/${quizData.length}`;
  let score10 = (totalCorrect / quizData.length * 10).toFixed(1);
  let feedback = score10 >= 8 ? "Giỏi quá!" : score10 >= 5 ? "Làm tốt lắm!" : "Cần cố gắng hơn nhé!";
  
  alert(`Điểm của bạn: ${scoreRatio} (${score10} điểm)\n${feedback}`);
  this.disabled = true;
  playCorrectSound();
  
  const formUrl = `https://docs.google.com/forms/d/e/1FAIpQLSelQyzh_lWyb2vZUnQ1jc1p9FLRknDZiUt9NiUiiX1epHTFLw/formResponse?usp=pp_url&entry.351633352=U1U2%20De%202&entry.1895948982=${encodeURIComponent(studentName)}&entry.1232319784=${encodeURIComponent(score10)}&entry.1125920425=${encodeURIComponent(scoreRatio)}&entry.1907417670=${encodeURIComponent(wrongDetails.join(", "))}`;
  
  fetch(formUrl, { mode: 'no-cors' }).catch(err => console.log(err));
  
  renderSummaryTable();
  document.getElementById("summary-container").style.display = "block";
  document.getElementById("summary-container").scrollIntoView({behavior: "smooth"});
});

function renderSummaryTable() {
  const container = document.getElementById("summary-tables");
  container.innerHTML = "";
  
  const chunkSize = 16;
  for (let i = 0; i < quizData.length; i += chunkSize) {
    let chunk = quizData.slice(i, i + chunkSize);
    let table = document.createElement("table");
    table.className = "summary-table";
    
    let trHead = document.createElement("tr");
    let thLabel = document.createElement("th");
    thLabel.textContent = "Câu";
    trHead.appendChild(thLabel);
    chunk.forEach(q => {
      let th = document.createElement("th");
      th.textContent = q.id;
      if (userState[q.id].selected === null) th.className = "empty-cell";
      trHead.appendChild(th);
    });
    table.appendChild(trHead);
    
    labels.forEach(lbl => {
      let tr = document.createElement("tr");
      let tdLabel = document.createElement("td");
      tdLabel.innerHTML = `<b>${lbl}</b>`;
      tr.appendChild(tdLabel);
      
      chunk.forEach(q => {
        let td = document.createElement("td");
        td.textContent = lbl;
        const state = userState[q.id];
        const correctOpt = q.options.find(o => o.isCorrect).label;
        
        if (state.selected === null) {
          td.className = "empty-cell";
        } else if (lbl === correctOpt) {
          td.className = "correct-cell";
        } else if (lbl === state.selected && !state.isCorrect) {
          td.className = "wrong-cell";
        } else {
          td.className = "neutral-cell";
        }
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
    
    container.appendChild(table);
    container.appendChild(document.createElement("br"));
  }
}
